<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1120" viewBox="0 0 1500 1120" role="img" aria-labelledby="title desc">
  <title id="title">PaperAgent Agent Harness 架构图</title>
  <desc id="desc">从多入口接入、配置、论文解析、证据与资产提取、并行总结、验证修复到 Word RenderQA，以及用户反馈驱动持续优化的完整架构。</desc>
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#1f2937" flood-opacity="0.10"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1f2937"/>
    </marker>
    <marker id="arrow-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#ea580c"/>
    </marker>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#7c3aed"/>
    </marker>
    <style>
      text { font-family: "Segoe UI", "Microsoft YaHei", "PingFang SC", Arial, sans-serif; fill: #172033; letter-spacing: 0; }
      .title { font-size: 36px; font-weight: 750; }
      .subtitle { font-size: 15px; fill: #64748b; }
      .layer-cn { font-size: 23px; font-weight: 700; }
      .layer-en { font-size: 14px; font-weight: 600; }
      .band-title { font-size: 22px; font-weight: 700; }
      .box-title { font-size: 16px; font-weight: 700; }
      .box-sub { font-size: 12px; fill: #64748b; }
      .small { font-size: 13px; }
      .tiny { font-size: 11px; fill: #64748b; }
      .flow { fill: none; stroke: #1f2937; stroke-width: 2; marker-end: url(#arrow); }
      .repair-flow { fill: none; stroke: #ea580c; stroke-width: 2.4; marker-end: url(#arrow-orange); }
      .evolve-flow { fill: none; stroke: #7c3aed; stroke-width: 2.4; marker-end: url(#arrow-purple); }
    </style>
  </defs>

  <rect width="1500" height="1120" fill="#fbfcfe"/>
  <text x="750" y="48" text-anchor="middle" class="title">PaperAgent Agent Harness 架构图</text>
  <text x="750" y="75" text-anchor="middle" class="subtitle">Grounded paper reading, bounded repair, resumable execution and render quality assurance</text>

  <!-- Layer labels -->
  <g text-anchor="middle">
    <text x="105" y="123" class="layer-cn" fill="#1d4ed8">入口层</text>
    <text x="105" y="148" class="layer-en" fill="#2563eb">Entry Layer</text>
    <text x="105" y="239" class="layer-cn" fill="#1d4ed8">配置层</text>
    <text x="105" y="264" class="layer-en" fill="#2563eb">Configuration</text>
    <text x="105" y="403" class="layer-cn" fill="#0f766e">工作流层</text>
    <text x="105" y="428" class="layer-en" fill="#0f766e">Workflow Runtime</text>
    <text x="105" y="666" class="layer-cn" fill="#c2410c">验证修复层</text>
    <text x="105" y="691" class="layer-en" fill="#ea580c">Verify &amp; Repair</text>
    <text x="105" y="837" class="layer-cn" fill="#15803d">交付层</text>
    <text x="105" y="862" class="layer-en" fill="#16a34a">Report &amp; QA</text>
    <text x="105" y="974" class="layer-cn" fill="#475569">持久化层</text>
    <text x="105" y="999" class="layer-en" fill="#64748b">Storage</text>
  </g>

  <!-- Entry -->
  <g filter="url(#shadow)">
    <rect x="215" y="92" width="1015" height="92" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
    <rect x="243" y="111" width="210" height="54" rx="7" fill="#ffffff" stroke="#60a5fa"/>
    <rect x="473" y="111" width="210" height="54" rx="7" fill="#ffffff" stroke="#60a5fa"/>
    <rect x="703" y="111" width="230" height="54" rx="7" fill="#ffffff" stroke="#60a5fa"/>
    <rect x="953" y="111" width="245" height="54" rx="7" fill="#ffffff" stroke="#60a5fa"/>
  </g>
  <g text-anchor="middle">
    <text x="348" y="134" class="box-title">CLI / Python</text><text x="348" y="153" class="box-sub">本地命令与批处理</text>
    <text x="578" y="134" class="box-title">Gradio Web</text><text x="578" y="153" class="box-sub">上传、链接、预览、下载</text>
    <text x="818" y="134" class="box-title">REST / Celery</text><text x="818" y="153" class="box-sub">异步任务与状态查询</text>
    <text x="1075" y="134" class="box-title">MCP / Skill</text><text x="1075" y="153" class="box-sub">Agent 工具与外部工作流</text>
  </g>
  <path d="M 720 184 L 720 205" class="flow"/>

  <!-- Configuration -->
  <g filter="url(#shadow)">
    <rect x="215" y="207" width="1015" height="105" rx="8" fill="#f4f7ff" stroke="#2563eb" stroke-width="2"/>
    <text x="722" y="233" text-anchor="middle" class="band-title" fill="#1d4ed8">配置中心与运行契约</text>
    <rect x="243" y="247" width="210" height="47" rx="7" fill="#ffffff" stroke="#93c5fd"/>
    <rect x="473" y="247" width="210" height="47" rx="7" fill="#ffffff" stroke="#93c5fd"/>
    <rect x="703" y="247" width="230" height="47" rx="7" fill="#ffffff" stroke="#93c5fd"/>
    <rect x="953" y="247" width="245" height="47" rx="7" fill="#ffffff" stroke="#93c5fd"/>
  </g>
  <g text-anchor="middle" class="small">
    <text x="348" y="276">config / env / secrets</text>
    <text x="578" y="276">OpenAI-compatible Client</text>
    <text x="818" y="276">Prompt / Rubric Patches</text>
    <text x="1075" y="276">Policy / Budget / Timeout</text>
  </g>
  <path d="M 720 312 L 720 333" class="flow"/>

  <!-- Runtime -->
  <g filter="url(#shadow)">
    <rect x="215" y="335" width="1015" height="270" rx="8" fill="#f0fdfa" stroke="#0f766e" stroke-width="2"/>
    <text x="722" y="365" text-anchor="middle" class="band-title" fill="#0f766e">可恢复 DAG / Graph Executor</text>
  </g>

  <!-- Runtime nodes -->
  <g filter="url(#shadow)">
    <rect x="240" y="385" width="170" height="82" rx="7" fill="#ffffff" stroke="#2dd4bf"/>
    <rect x="428" y="385" width="170" height="82" rx="7" fill="#ffffff" stroke="#2dd4bf"/>
    <rect x="616" y="385" width="170" height="82" rx="7" fill="#ffffff" stroke="#2dd4bf"/>
    <rect x="804" y="385" width="190" height="82" rx="7" fill="#ffffff" stroke="#2dd4bf"/>
    <rect x="1012" y="385" width="190" height="82" rx="7" fill="#ffffff" stroke="#2dd4bf"/>
  </g>
  <g text-anchor="middle">
    <text x="325" y="414" class="box-title">PreparePaper</text><text x="325" y="439" class="box-sub">文件、链接、页码</text><text x="325" y="456" class="tiny">Reader</text>
    <text x="513" y="414" class="box-title">ParsePaper</text><text x="513" y="439" class="box-sub">正文、版面、图表公式</text><text x="513" y="456" class="tiny">Reader + Tools</text>
    <text x="701" y="414" class="box-title">ExtractSections</text><text x="701" y="439" class="box-sub">Evidence / Asset Manifest</text><text x="701" y="456" class="tiny">Extractor</text>
    <text x="899" y="410" class="box-title">SummarizeContribution</text><text x="899" y="435" class="box-sub">分段笔记并行生成</text><text x="899" y="452" class="tiny">Synthesizer</text>
    <text x="1107" y="414" class="box-title">ExtractMethods</text><text x="1107" y="439" class="box-sub">分层整合与结构化报告</text><text x="1107" y="456" class="tiny">Synthesizer</text>
  </g>
  <path d="M 410 426 L 426 426" class="flow"/><path d="M 598 426 L 614 426" class="flow"/>
  <path d="M 786 426 L 802 426" class="flow"/><path d="M 994 426 L 1010 426" class="flow"/>

  <!-- Runtime support panels -->
  <g>
    <rect x="240" y="490" width="465" height="93" rx="7" fill="#ecfeff" stroke="#14b8a6"/>
    <text x="472" y="516" text-anchor="middle" class="box-title" fill="#0f766e">证据与视觉资产 Evidence &amp; Assets</text>
    <rect x="257" y="530" width="98" height="36" rx="6" fill="#ffffff" stroke="#99f6e4"/>
    <rect x="365" y="530" width="98" height="36" rx="6" fill="#ffffff" stroke="#99f6e4"/>
    <rect x="473" y="530" width="105" height="36" rx="6" fill="#ffffff" stroke="#99f6e4"/>
    <rect x="588" y="530" width="100" height="36" rx="6" fill="#ffffff" stroke="#99f6e4"/>
    <text x="306" y="553" text-anchor="middle" class="tiny">Grounding Map</text>
    <text x="414" y="553" text-anchor="middle" class="tiny">Knowledge Graph</text>
    <text x="525" y="553" text-anchor="middle" class="tiny">Asset Candidates</text>
    <text x="638" y="553" text-anchor="middle" class="tiny">PDF Geometry</text>

    <rect x="725" y="490" width="477" height="93" rx="7" fill="#f8fafc" stroke="#64748b"/>
    <text x="963" y="516" text-anchor="middle" class="box-title" fill="#475569">并行、恢复与资源控制 Parallel &amp; Resume</text>
    <rect x="742" y="530" width="104" height="36" rx="6" fill="#ffffff" stroke="#cbd5e1"/>
    <rect x="856" y="530" width="104" height="36" rx="6" fill="#ffffff" stroke="#cbd5e1"/>
    <rect x="970" y="530" width="104" height="36" rx="6" fill="#ffffff" stroke="#cbd5e1"/>
    <rect x="1084" y="530" width="101" height="36" rx="6" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="794" y="553" text-anchor="middle" class="tiny">Chunk Parallel</text>
    <text x="908" y="553" text-anchor="middle" class="tiny">Partial Integrate</text>
    <text x="1022" y="553" text-anchor="middle" class="tiny">Checkpoints</text>
    <text x="1134" y="553" text-anchor="middle" class="tiny">Retry / Cancel</text>
  </g>
  <path d="M 720 605 L 720 626" class="flow"/>

  <!-- Verify and repair -->
  <g filter="url(#shadow)">
    <rect x="215" y="628" width="1015" height="168" rx="8" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/>
    <text x="722" y="658" text-anchor="middle" class="band-title" fill="#c2410c">Verifier &amp; Bounded Repair Loop</text>
    <rect x="240" y="678" width="168" height="88" rx="7" fill="#ffffff" stroke="#fb923c"/>
    <rect x="425" y="678" width="175" height="88" rx="7" fill="#ffffff" stroke="#fb923c"/>
    <rect x="617" y="678" width="175" height="88" rx="7" fill="#ffffff" stroke="#fb923c"/>
    <rect x="809" y="678" width="175" height="88" rx="7" fill="#ffffff" stroke="#fb923c"/>
    <rect x="1001" y="678" width="201" height="88" rx="7" fill="#ffffff" stroke="#fb923c"/>
  </g>
  <g text-anchor="middle">
    <text x="324" y="706" class="box-title">VerifyClaims</text><text x="324" y="730" class="box-sub">Claim / Citation / Format</text><text x="324" y="749" class="tiny">Critic + structured JSON</text>
    <text x="512" y="706" class="box-title">Layered Guards</text><text x="512" y="730" class="box-sub">Evidence / Asset / Visual</text><text x="512" y="749" class="tiny">deterministic first</text>
    <text x="704" y="706" class="box-title">Typed Finding</text><text x="704" y="730" class="box-sub">reason / confidence / proof</text><text x="704" y="749" class="tiny">transport != content</text>
    <text x="896" y="706" class="box-title">Repair State Machine</text><text x="896" y="730" class="box-sub">recrop / split / rewrite</text><text x="896" y="749" class="tiny">cost + action budget</text>
    <text x="1102" y="706" class="box-title">Localized Recheck</text><text x="1102" y="730" class="box-sub">content signature + affected guard</text><text x="1102" y="749" class="tiny">pass / warn / bounded block</text>
  </g>
  <path d="M 408 722 L 423 722" class="repair-flow"/><path d="M 600 722 L 615 722" class="repair-flow"/>
  <path d="M 792 722 L 807 722" class="repair-flow"/><path d="M 984 722 L 999 722" class="repair-flow"/>
  <path d="M 1102 678 C 1102 646 896 646 896 676" class="repair-flow"/>
  <text x="1000" y="642" text-anchor="middle" class="tiny" fill="#c2410c">失败后只重跑受影响资产 / Guard</text>
  <path d="M 720 796 L 720 817" class="flow"/>

  <!-- Report and QA -->
  <g filter="url(#shadow)">
    <rect x="215" y="819" width="1015" height="108" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
    <text x="722" y="847" text-anchor="middle" class="band-title" fill="#15803d">报告生成与交付质量检查</text>
    <rect x="250" y="862" width="205" height="45" rx="7" fill="#ffffff" stroke="#86efac"/>
    <rect x="482" y="862" width="205" height="45" rx="7" fill="#ffffff" stroke="#86efac"/>
    <rect x="714" y="862" width="205" height="45" rx="7" fill="#ffffff" stroke="#86efac"/>
    <rect x="946" y="862" width="250" height="45" rx="7" fill="#ffffff" stroke="#86efac"/>
  </g>
  <g text-anchor="middle" class="small">
    <text x="352" y="890">GenerateReport / DOCX</text>
    <text x="584" y="890">图表与 caption 写入</text>
    <text x="816" y="890">RenderQA / 页面检查</text>
    <text x="1071" y="890">下载 Word 或简明失败原因</text>
  </g>
  <path d="M 455 884 L 480 884" class="flow"/><path d="M 687 884 L 712 884" class="flow"/><path d="M 919 884 L 944 884" class="flow"/>
  <path d="M 720 927 L 720 948" class="flow"/>

  <!-- Storage -->
  <g filter="url(#shadow)">
    <rect x="215" y="950" width="1015" height="89" rx="8" fill="#f8fafc" stroke="#64748b" stroke-width="2"/>
    <text x="722" y="976" text-anchor="middle" class="band-title" fill="#475569">内容寻址 Checkpoint 与可审计 Sidecars</text>
    <rect x="245" y="990" width="150" height="32" rx="6" fill="#ffffff" stroke="#cbd5e1"/>
    <rect x="410" y="990" width="165" height="32" rx="6" fill="#ffffff" stroke="#cbd5e1"/>
    <rect x="590" y="990" width="150" height="32" rx="6" fill="#ffffff" stroke="#cbd5e1"/>
    <rect x="755" y="990" width="175" height="32" rx="6" fill="#ffffff" stroke="#cbd5e1"/>
    <rect x="945" y="990" width="255" height="32" rx="6" fill="#ffffff" stroke="#cbd5e1"/>
  </g>
  <g text-anchor="middle" class="tiny">
    <text x="320" y="1011">trace.json</text><text x="492" y="1011">verification.json</text>
    <text x="665" y="1011">qa.json</text><text x="842" y="1011">acceptance.json</text>
    <text x="1072" y="1011">chunk cache / assets / artifacts</text>
  </g>

  <!-- Evolution rail -->
  <g filter="url(#shadow)">
    <rect x="1260" y="208" width="210" height="719" rx="8" fill="#faf5ff" stroke="#7c3aed" stroke-width="2"/>
    <text x="1365" y="238" text-anchor="middle" class="band-title" fill="#6d28d9">反馈与自进化</text>
    <text x="1365" y="260" text-anchor="middle" class="tiny" fill="#7c3aed">Feedback &amp; Evolution</text>
    <rect x="1282" y="286" width="166" height="70" rx="7" fill="#ffffff" stroke="#a78bfa"/>
    <rect x="1282" y="389" width="166" height="70" rx="7" fill="#ffffff" stroke="#a78bfa"/>
    <rect x="1282" y="492" width="166" height="70" rx="7" fill="#ffffff" stroke="#a78bfa"/>
    <rect x="1282" y="595" width="166" height="70" rx="7" fill="#ffffff" stroke="#a78bfa"/>
    <rect x="1282" y="698" width="166" height="70" rx="7" fill="#ffffff" stroke="#a78bfa"/>
    <rect x="1282" y="801" width="166" height="91" rx="7" fill="#ffffff" stroke="#a78bfa"/>
  </g>
  <g text-anchor="middle">
    <text x="1365" y="315" class="box-title">User Feedback</text><text x="1365" y="338" class="box-sub">明确修正与失败样本</text>
    <text x="1365" y="418" class="box-title">Correction Memory</text><text x="1365" y="441" class="box-sub">paper / domain / global</text>
    <text x="1365" y="521" class="box-title">Failure Mining</text><text x="1365" y="544" class="box-sub">聚类 finding 与轨迹</text>
    <text x="1365" y="624" class="box-title">Prompt Patch</text><text x="1365" y="647" class="box-sub">extraction / summary</text>
    <text x="1365" y="727" class="box-title">Rubric Patch</text><text x="1365" y="750" class="box-sub">evaluation / guard policy</text>
    <text x="1365" y="831" class="box-title">Future Runs</text><text x="1365" y="854" class="box-sub">受版本与置信度约束</text><text x="1365" y="875" class="tiny">可回滚，不污染当前结果</text>
  </g>
  <path d="M 1365 356 L 1365 387" class="evolve-flow"/><path d="M 1365 459 L 1365 490" class="evolve-flow"/>
  <path d="M 1365 562 L 1365 593" class="evolve-flow"/><path d="M 1365 665 L 1365 696" class="evolve-flow"/>
  <path d="M 1365 768 L 1365 799" class="evolve-flow"/>
  <path d="M 1282 846 C 1238 846 1252 269 1232 269" class="evolve-flow"/>
  <text x="1246" y="505" text-anchor="middle" class="tiny" fill="#7c3aed" transform="rotate(-90 1246 505)">版本化反馈注入</text>

  <!-- Bottom loop legend -->
  <g filter="url(#shadow)">
    <rect x="215" y="1061" width="1255" height="44" rx="8" fill="#ffffff" stroke="#94a3b8"/>
  </g>
  <text x="245" y="1089" class="box-title" fill="#334155">典型闭环</text>
  <g class="small" font-weight="650">
    <text x="350" y="1089" fill="#2563eb">Input</text><text x="420" y="1089">→</text>
    <text x="460" y="1089" fill="#0f766e">Parse &amp; Ground</text><text x="590" y="1089">→</text>
    <text x="630" y="1089" fill="#0f766e">Synthesize</text><text x="730" y="1089">→</text>
    <text x="770" y="1089" fill="#ea580c">Verify &amp; Repair</text><text x="905" y="1089">→</text>
    <text x="945" y="1089" fill="#16a34a">RenderQA</text><text x="1025" y="1089">→</text>
    <text x="1065" y="1089" fill="#475569">Record</text><text x="1130" y="1089">→</text>
    <text x="1170" y="1089" fill="#7c3aed">Learn for Future Runs</text>
  </g>
</svg>
